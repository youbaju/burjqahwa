<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>برج القهوة</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin:0; padding:0; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    color: #f5e6d0;
    touch-action: manipulation;
  }
  #app{
    position:relative;
    height:100%; width:100%;
  }
  canvas{
    position:absolute; top:0; left:0;
    display:block;
  }
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 18px 20px;
    z-index:5;
    pointer-events:none;
  }
  #scoreWrap{
    display:flex; flex-direction:column; align-items:flex-start;
  }
  #score{
    font-size: 30px;
    font-weight:bold;
    color: #f0c878;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    line-height:1;
  }
  #comboWrap{
    font-size: 13px;
    color: #ffd27a;
    opacity:0;
    margin-top: 4px;
    font-weight:bold;
    transition: opacity 0.3s ease;
  }
  #best{
    font-size:13px; opacity:0.85;
    background: rgba(0,0,0,0.25);
    padding: 5px 12px;
    border-radius: 14px;
  }
  #overlay{
    position:absolute; inset:0;
    background: rgba(15,10,20,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 20;
    text-align:center;
    padding: 0 24px;
  }
  #overlay .icon{
    font-size: 52px;
    margin-bottom: 6px;
  }
  #overlay h1, #overlay h2{
    font-size: 26px;
    color: #f0c878;
    margin-bottom: 8px;
  }
  #overlay p{
    font-size: 15px;
    opacity: 0.85;
    margin: 4px 0 22px 0;
    max-width: 320px;
    line-height:1.6;
  }
  .btn{
    background: linear-gradient(180deg, #f0c878, #d4a24c);
    color: #241634;
    border:none;
    padding: 14px 42px;
    font-size: 17px;
    font-weight:bold;
    border-radius: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .btn:active{ transform: scale(0.96); }
  .btn2{
    background: transparent;
    color: #f0c878;
    border: 2px solid rgba(240,200,120,0.5);
    padding: 10px 30px;
    font-size: 14px;
    border-radius: 24px;
    margin-top: 12px;
  }
  #statRow{
    display:flex; gap:20px;
    margin-bottom: 8px;
  }
  .statBox{
    text-align:center;
  }
  .statBox .val{ font-size:22px; font-weight:bold; color:#f0c878; }
  .statBox .lbl{ font-size:11px; opacity:0.7; }
  #tapzone{
    position:absolute; inset:0;
    z-index: 10;
  }
  #perfectLabel{
    position:absolute;
    left:50%;
    top: 32%;
    transform: translate(-50%, 0);
    font-size: 22px;
    font-weight:bold;
    color: #f0c878;
    opacity:0;
    z-index: 6;
    pointer-events:none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    white-space: nowrap;
  }
  #soundBtn{
    position:absolute;
    top: 18px; right: 20px;
    z-index: 22;
    background: rgba(0,0,0,0.3);
    border: none;
    color: #f5e6d0;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 16px;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="best">🏆 الأفضل: 0</span>
    <div id="scoreWrap">
      <span id="score">0</span>
      <span id="comboWrap">🔥 متتالية ×0</span>
    </div>
  </div>
  <div id="perfectLabel">مثالي! ✨</div>
  <div id="tapzone"></div>

  <div id="overlay">
    <div class="icon">☕🗼</div>
    <h1>برج القهوة</h1>
    <p>اضغط بالوقت المناسب عشان توقف الفنجال فوق اللي قبله بالضبط. اجمع "متتاليات مثالية" عشان تكسب نقاط إضافية والبرج يصير ذهبي!</p>
    <button class="btn" id="startBtn">ابدأ البناء</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var comboWrap = document.getElementById('comboWrap');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var tapzone = document.getElementById('tapzone');
  var perfectLabel = document.getElementById('perfectLabel');

  var best = 0;
  try { best = parseInt(localStorage.getItem('burj_qahwa_best') || '0', 10) || 0; } catch(e){}
  bestEl.textContent = '🏆 الأفضل: ' + best;

  // ---- Audio (Web Audio API, no external files) ----
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol){
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  function sfxPlace(){ beep(420, 0.09, 'sine', 0.12); }
  function sfxPerfect(){ beep(700, 0.08, 'triangle', 0.14); setTimeout(function(){ beep(950, 0.12, 'triangle', 0.12); }, 60); }
  function sfxFail(){
    if (!audioCtx) return;
    // soft descending "thud" instead of a harsh sawtooth siren
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.28);
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }
  function vibrate(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

  // ---- Theme: coffee-pot layers, color shifts with height, sky gradient ----
  var cupColors = ['#d4a24c','#c98a3a','#e0b45f','#b97a30','#f0c878','#caa052'];

  var blocks = [];
  var moving = null;
  var layerHeight = 32;
  var baseWidth;
  var cameraY = 0;
  var running = false;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var rafId = null;
  var lastTime = null;
  var particles = [];
  var shakeT = 0;
  var steamTimer = 0.5;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  function resetGame(){
    baseWidth = Math.min(W * 0.55, 220);
    blocks = [{ x: W/2 - baseWidth/2, w: baseWidth, colorIdx: 0, perfect:false }];
    score = 0;
    combo = 0;
    maxCombo = 0;
    cameraY = 0;
    scoreEl.textContent = '0';
    comboWrap.style.opacity = '0';
    steamPuffs = [];
    steamTimer = 0.5;
    spawnMoving();
  }

  function spawnMoving(){
    var last = blocks[blocks.length-1];
    var speed = Math.min(130 + score * 8.5, 430);
    var dir = Math.random() < 0.5 ? -1 : 1;
    var startX = dir === 1 ? -last.w : W;
    moving = {
      x: startX,
      w: last.w,
      dir: dir,
      speed: speed,
      colorIdx: blocks.length % cupColors.length
    };
  }

  function skyColors(){
    // shift from warm dusk to deep night as score climbs
    var t = Math.min(score / 40, 1);
    var top1 = lerpColor('#3a2a52','#0d0a24', t);
    var top2 = lerpColor('#7a4a3a','#1b1230', t);
    return [top1, top2];
  }
  function lerpColor(a,b,t){
    var ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
    var ar=(ah>>16)&255, ag=(ah>>8)&255, ab=ah&255;
    var br=(bh>>16)&255, bg=(bh>>8)&255, bb=bh&255;
    var r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
    return 'rgb('+r+','+g+','+bl+')';
  }

  function loop(ts){
    if (!running) return;
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (moving){
      moving.x += moving.dir * moving.speed * dt;
      if (moving.x <= 0){ moving.x = 0; moving.dir = 1; }
      if (moving.x + moving.w >= W){ moving.x = W - moving.w; moving.dir = -1; }
    }

    for (var i = particles.length-1; i >= 0; i--){
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.rot += p.vr * dt;
      if (p.life <= 0) particles.splice(i,1);
    }

    if (shakeT > 0) shakeT -= dt;

    steamTimer -= dt;
    if (steamTimer <= 0 && blocks.length > 0){
      steamTimer = 0.5;
      var topB = blocks[blocks.length-1];
      var baseY2 = H - 120;
      var topY2 = baseY2 - (blocks.length-1) * layerHeight + cameraY;
      spawnSteam(topB.x + topB.w/2, topY2);
    }
    updateSteam(dt);

    draw();
    rafId = requestAnimationFrame(loop);
  }

  function draw(){
    var sky = skyColors();
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, sky[0]);
    grad.addColorStop(1, sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#f0c878';
    for (var s=0; s<24; s++){
      var sx = (s * 131 + 17) % W;
      var sy = (s * 71 + 20) % (H*0.6);
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();

    var shakeX = shakeT > 0 ? (Math.random()-0.5) * shakeT * 18 : 0;
    ctx.save();
    ctx.translate(shakeX, 0);

    var baseY = H - 120;

    for (var i=0; i<blocks.length; i++){
      var b = blocks[i];
      var y = baseY - i * layerHeight + cameraY;
      if (y < -layerHeight || y > H) continue;
      drawBlock(b.x, y, b.w, layerHeight, cupColors[b.colorIdx % cupColors.length], b.perfect);
    }

    if (moving){
      var topIndex = blocks.length;
      var my = baseY - topIndex * layerHeight + cameraY;
      drawBlock(moving.x, my, moving.w, layerHeight, cupColors[moving.colorIdx % cupColors.length], false);
    }

    for (var j=0; j<particles.length; j++){
      var p2 = particles[j];
      ctx.save();
      ctx.globalAlpha = Math.max(p2.life / p2.maxLife, 0);
      ctx.translate(p2.x + p2.w/2, p2.y + layerHeight/2);
      ctx.rotate(p2.rot);
      ctx.fillStyle = p2.color;
      ctx.fillRect(-p2.w/2, -layerHeight/2, p2.w, layerHeight);
      ctx.restore();
    }

    drawSteam();

    ctx.restore();
  }

  function drawBlock(x, y, w, h, color, isPerfect){
    ctx.save();
    if (isPerfect){
      ctx.shadowColor = 'rgba(240,200,120,0.8)';
      ctx.shadowBlur = 14;
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetY = 3;
    }

    var bodyGrad = ctx.createLinearGradient(x, y, x, y+h);
    bodyGrad.addColorStop(0, lighten(color, 0.28));
    bodyGrad.addColorStop(0.5, color);
    bodyGrad.addColorStop(1, lighten(color, -0.18));
    ctx.fillStyle = bodyGrad;
    roundRect(ctx, x, y, w, h, 6);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = isPerfect ? 0.5 : 0.25;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, w, 3);
    ctx.restore();

    if (isPerfect){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, x+1.5, y+1.5, w-3, h-3, 5);
      ctx.stroke();
      ctx.restore();
    }

    return { topY: y };
  }

  function lighten(hex, amt){
    var h = hex.replace('#','');
    var r = parseInt(h.substring(0,2),16);
    var g = parseInt(h.substring(2,4),16);
    var b = parseInt(h.substring(4,6),16);
    r = Math.max(0, Math.min(255, Math.round(r + 255*amt)));
    g = Math.max(0, Math.min(255, Math.round(g + 255*amt)));
    b = Math.max(0, Math.min(255, Math.round(b + 255*amt)));
    return 'rgb('+r+','+g+','+b+')';
  }

  var steamPuffs = [];
  function spawnSteam(x, y){
    steamPuffs.push({x:x, y:y, life:1.4, maxLife:1.4, drift:(Math.random()-0.5)*14, size: 3 + Math.random()*3});
  }
  function updateSteam(dt){
    for (var i = steamPuffs.length-1; i >= 0; i--){
      var s = steamPuffs[i];
      s.life -= dt;
      s.y -= 26 * dt;
      s.x += s.drift * dt;
      if (s.life <= 0) steamPuffs.splice(i,1);
    }
  }
  function drawSteam(){
    for (var k=0; k<steamPuffs.length; k++){
      var s = steamPuffs[k];
      ctx.save();
      ctx.globalAlpha = Math.max(s.life / s.maxLife, 0) * 0.35;
      ctx.fillStyle = '#f5e6d0';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function showPerfect(comboCount){
    var text = comboCount >= 5 ? ('🔥 متتالية مثالية ×' + comboCount + '!') :
               comboCount >= 2 ? ('✨ مثالي ×' + comboCount) : 'مثالي! ✨';
    perfectLabel.textContent = text;
    perfectLabel.style.transition = 'none';
    perfectLabel.style.opacity = '1';
    perfectLabel.style.transform = 'translate(-50%, -10px) scale(1.1)';
    requestAnimationFrame(function(){
      perfectLabel.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
      perfectLabel.style.opacity = '0';
      perfectLabel.style.transform = 'translate(-50%, -30px) scale(1)';
    });
  }

  function onTap(){
    ensureAudio();
    if (!running || !moving) return;

    var last = blocks[blocks.length-1];
    var mLeft = moving.x, mRight = moving.x + moving.w;
    var lLeft = last.x, lRight = last.x + last.w;

    var overlapLeft = Math.max(mLeft, lLeft);
    var overlapRight = Math.min(mRight, lRight);
    var overlapW = overlapRight - overlapLeft;

    if (overlapW <= 4){
      sfxFail();
      vibrate(120);
      shakeT = 0.4;
      endGame();
      return;
    }

    var isPerfect = Math.abs(mLeft - lLeft) < 5 && Math.abs(mRight - lRight) < 5;

    var baseY = H - 120;
    var topIndex = blocks.length;
    var my = baseY - topIndex * layerHeight + cameraY;
    var colorHex = cupColors[moving.colorIdx % cupColors.length];

    var points = 1;

    if (!isPerfect){
      combo = 0;
      comboWrap.style.opacity = '0';
      if (mLeft < overlapLeft){
        particles.push({x:mLeft, y:my, w:overlapLeft-mLeft, vx:-70, vy:-90, life:0.6, maxLife:0.6, color: colorHex, rot:0, vr:-4});
      }
      if (mRight > overlapRight){
        particles.push({x:overlapRight, y:my, w:mRight-overlapRight, vx:70, vy:-90, life:0.6, maxLife:0.6, color: colorHex, rot:0, vr:4});
      }
      sfxPlace();
      vibrate(10);
    } else {
      combo += 1;
      maxCombo = Math.max(maxCombo, combo);
      points += combo; // bonus points for streaks
      comboWrap.textContent = '🔥 متتالية ×' + combo;
      comboWrap.style.opacity = '1';
      showPerfect(combo);
      sfxPerfect();
      vibrate(combo >= 5 ? [10,30,10] : 15);
    }

    blocks.push({ x: overlapLeft, w: overlapW, colorIdx: moving.colorIdx, perfect: isPerfect });
    score += points;
    scoreEl.textContent = String(score);

    var targetTopY = 220;
    var newTopY = baseY - blocks.length * layerHeight + cameraY;
    if (newTopY < targetTopY){
      cameraY += (targetTopY - newTopY);
    }

    if (overlapW < 6){
      sfxFail();
      endGame();
      return;
    }

    spawnMoving();
  }

  function endGame(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    moving = null;

    if (score > best){
      best = score;
      try { localStorage.setItem('burj_qahwa_best', String(best)); } catch(e){}
    }
    bestEl.textContent = '🏆 الأفضل: ' + best;

    overlay.querySelector('.icon').textContent = '☕💥';
    var h1 = overlay.querySelector('h1');
    h1.textContent = 'وقع البرج!';

    var oldP = overlay.querySelector('p');
    oldP.innerHTML = '';
    var statRow = document.createElement('div');
    statRow.id = 'statRow';
    statRow.innerHTML =
      '<div class="statBox"><div class="val">' + score + '</div><div class="lbl">النقاط</div></div>' +
      '<div class="statBox"><div class="val">' + maxCombo + '</div><div class="lbl">أفضل متتالية</div></div>' +
      '<div class="statBox"><div class="val">' + best + '</div><div class="lbl">أعلى نتيجة</div></div>';
    oldP.parentNode.insertBefore(statRow, oldP);
    oldP.style.display = 'none';

    startBtn.textContent = 'حاول مرة ثانية';
    overlay.style.display = 'flex';
  }

  function startGame(){
    ensureAudio();
    overlay.style.display = 'none';
    var oldStat = document.getElementById('statRow');
    if (oldStat) oldStat.remove();
    var p = overlay.querySelector('p');
    p.style.display = 'block';
    p.textContent = 'اضغط بالوقت المناسب عشان توقف الفنجال فوق اللي قبله بالضبط. اجمع "متتاليات مثالية" عشان تكسب نقاط إضافية!';
    overlay.querySelector('.icon').textContent = '☕🗼';
    overlay.querySelector('h1').textContent = 'برج القهوة';

    resetGame();
    running = true;
    lastTime = null;
    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  tapzone.addEventListener('touchstart', function(e){ e.preventDefault(); onTap(); }, {passive:false});
  tapzone.addEventListener('mousedown', function(e){ onTap(); });

  draw();
})();
</script>
</body>
</html>
